<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#F2F4F1;--ink:#15302B;--mut:#5C706A;--line:#D3DBD6;--card:#fff;--sp:#17332E;--ac:#F2B705;--ck:#17332E;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1917;--ink:#E5EDEA;--mut:#97ABA5;--line:#2A3A35;--card:#16231F;--sp:#0B1412;--ck:#F2B705}}
:root[data-theme="dark"]{--bg:#0F1917;--ink:#E5EDEA;--mut:#97ABA5;--line:#2A3A35;--card:#16231F;--sp:#0B1412;--ck:#F2B705}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.4em .75em;cursor:pointer}
button:hover{border-color:var(--mut)}
:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.45em .6em}
input[type=checkbox]{accent-color:var(--ck);width:1.2em;height:1.2em;padding:0;flex:none}
header{background:var(--sp);color:#fff;padding:14px 16px}
header h1{margin:0 0 8px;font:700 1.6rem Georgia,"Iowan Old Style",serif}
.tr,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header select{max-width:100%;font-weight:600;color:var(--ink)}
header button{background:transparent;color:#fff;border-color:#ffffff55}
[hidden]{display:none!important}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.top h1{margin:0}
nav{display:flex;gap:4px}
.nv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button:disabled{opacity:.45;cursor:default}
.syn{background:transparent;color:#fff;border:1px solid #ffffff55;font-size:.8rem;padding:.25em .6em;white-space:nowrap}
.syn.ok{border-color:#6FA287}
.syn.pend,.syn.offline{border-color:var(--ac);color:var(--ac)}
.syn.err{background:#C4572F;border-color:#C4572F}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;font-weight:600;padding:.3em .6em}
nav button[aria-current=page]{border-bottom-color:var(--ac)}
.bar{padding:12px 16px;max-width:900px;margin:auto}
.bar #q{flex:1 1 180px}
.bar label{display:flex;gap:6px;align-items:center}
#add{background:var(--sp);color:#fff;border-color:var(--sp)}
main{max-width:900px;margin:auto;padding:0 16px 24px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.cat h2{margin:0;padding:10px 12px;font:700 1.15rem Georgia,"Iowan Old Style",serif;display:flex;gap:8px;align-items:baseline;cursor:pointer;border-bottom:1px solid var(--line)}
.cat h2 small{margin-left:auto;font:400 .8rem system-ui;color:var(--mut);text-align:right}
.car{width:1em;color:var(--mut)}
.cat h3{margin:0;padding:6px 12px 2px;font-size:.9rem;color:var(--mut);font-weight:600}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);border-left:4px solid transparent}
.row:first-child{border-top:0}
.row.pb{border-left-color:var(--ac);background:rgba(242,183,5,.14)}
.row.pp{border-left-color:#4C8C73}
.pl.b{background:var(--ac);border-color:var(--ac);color:#15302B;font-weight:700}
.pl.p{border-color:#4C8C73;color:var(--ink)}
.lg{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut)}
.lg i{width:.85em;height:.85em;border-radius:2px;display:inline-block}
.lb{background:var(--ac)}.lp{background:#4C8C73;margin-left:6px}
.bk{display:flex;flex-wrap:wrap;gap:0 10px;justify-content:flex-end}
.bk span:before{content:'';display:inline-block;width:.65em;height:.65em;border-radius:2px;margin-right:4px;background:var(--mut)}
.bk .b:before{background:var(--ac)}.bk .p:before{background:#4C8C73}
.bk b{color:var(--ink)}
.row label{flex:1;display:flex;gap:10px;align-items:flex-start;min-width:0;cursor:pointer}
.row:not(.on) label>span{color:var(--mut)}
.row small{display:block;font-size:.78rem;color:var(--mut)}
.tag{font-style:normal;font-size:.72rem;background:var(--ac);color:#15302B;border-radius:4px;padding:0 5px;margin-left:6px}
.w{min-width:4.6em;text-align:right;font-variant-numeric:tabular-nums;border-color:transparent;background:transparent}
.w.mod{border-color:var(--ac);font-weight:700}
.pl{font-size:.78rem;padding:.2em .55em;color:var(--mut)}
.data{max-width:900px;margin:0 auto 16px;padding:0 16px;color:var(--mut)}
.data button,.data input{margin:6px 6px 0 0}
footer{position:sticky;bottom:0;background:var(--ac);color:#15302B;display:flex;justify-content:space-around;gap:8px;padding:8px 12px;text-align:center;border-top:3px solid var(--sp)}
footer b{display:block;font:700 1.15rem Georgia,serif;font-variant-numeric:tabular-nums}
footer span{font-size:.72rem}
footer b{font-size:.95rem}
footer{flex-direction:column;align-items:stretch;gap:2px}
.fr{display:flex;gap:4px}
.fr>*{flex:1;min-width:0}
footer .fd{background:transparent;border:1px dashed #15302B66;color:inherit;padding:0}
.sm{border-left:2px solid #15302B33}
.fn{font-size:.78rem}
.fl{font-size:.78rem;padding:.1em .5em;margin-top:2px;color:var(--mut)}
.fl.mod{border-color:var(--ac)}
.mini{padding:0 .4em;border-color:transparent;background:transparent;color:var(--mut)}
.qt{display:flex;align-items:center;gap:4px}
.qt button{padding:.1em .55em}
header h1 small{font:400 .8rem system-ui;opacity:.7}
.sub{display:flex;flex-wrap:wrap;gap:6px;width:calc(100% - 32px);max-width:868px;margin:14px auto 16px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.cat h3.sl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.cat h3.sl small{margin-left:auto;font-weight:400}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:10px 12px}
.fg label{font-size:.8rem;color:var(--mut)}
.fg input,.fg select{width:100%;display:block;margin-top:2px}
.fg>div{align-self:end}
.hint{font-size:.8rem;color:var(--mut);padding:0 12px 10px;margin:0}
#wdlg{width:min(640px,96vw);max-height:90vh;overflow:auto}
.wpie{display:block;width:min(260px,70vw);margin:0 auto 8px}
.sw{display:inline-block;width:.9em;height:.9em;border-radius:3px;margin-right:6px;vertical-align:-1px}
#wb{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#vb{display:flex;justify-content:flex-end;margin-top:12px}
#vdlg{width:min(640px,96vw);max-height:90vh;overflow:auto}
.cmp td:first-child{white-space:normal}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.55;font-style:italic}
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:.9rem;color:var(--mut)}
.vbar button{padding:.2em .7em}
.vbar button.on{background:var(--sp);color:#fff;border-color:var(--sp)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.pg:first-of-type{border-top:0}
.pg label{font-size:.8rem;color:var(--mut)}
.pg input,.pg select{width:100%;display:block;margin-top:2px}
.pg .wide{grid-column:1/-1}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.prow input:not([type=checkbox]){min-width:0}
.prow .z{flex:0 0 7em}
.prow .f{flex:1 1 9em}
.prow a.mini{text-decoration:none;font-size:1.1rem}
.cat h2 small input{font-size:.85rem;padding:.15em .4em}
textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.45em .6em;width:100%;min-height:7em;resize:vertical}
footer{cursor:pointer}
.ck{display:block;padding:4px 0}
.pks{padding:.15em .3em;font-size:.8rem}
dialog .ck input{width:auto;display:inline;margin:0 8px 0 0}
.sub button[aria-current=page]{background:var(--sp);color:#fff;border-color:var(--sp)}
.xtb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.xs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.xs div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.xs b{display:block;font:700 1.1rem Georgia,serif;font-variant-numeric:tabular-nums}
.xs span{font-size:.8rem;color:var(--mut)}
.xw{overflow-x:auto}
.xt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.xt th,.xt td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.xt th:first-child,.xt td:first-child{text-align:left}
.xt th{border-top:0;color:var(--mut);font-weight:600}
.xt tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.xr{flex:1;text-align:left;border:0;background:transparent;padding:0;min-width:0}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(420px,94vw);padding:16px}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 10px;font:700 1.2rem Georgia,serif}
dialog label{display:block;margin-bottom:8px;font-size:.85rem;color:var(--mut)}
dialog input,dialog select{width:100%;display:block;margin-top:2px}
#mb{display:flex;flex-direction:row-reverse;gap:8px;justify-content:flex-end;margin-top:12px}
#acts,#xb,#fdb,#cbt,#sbt{display:flex;flex-direction:column;gap:6px;margin-top:12px}
#acts .ghost,#xb .ghost,#fdb .ghost,#cbt .ghost,#sbt .ghost{border-color:transparent;color:var(--mut)}
#pr{display:none}
@media print{
 body{background:#fff;color:#000;font:10pt/1.35 system-ui,sans-serif}
 #app{display:none}
 #pr{display:block;columns:2;column-gap:10mm}
 #pr h1{column-span:all;font:700 18pt Georgia,serif;margin:0}
 #pr p{column-span:all;margin:2px 0 8px;color:#333}
 #pr section{break-inside:avoid-page;margin-bottom:8px}
 #pr h2{font:700 12pt Georgia,serif;margin:6px 0 2px;border-bottom:1px solid #000}
 #pr h3{font-size:9pt;margin:4px 0 0;color:#333}
 #pr li{display:flex;gap:6px;align-items:center;padding:1.5px 0;break-inside:avoid}
 #pr .bx{width:3.2mm;height:3.2mm;border:1px solid #000;flex:none}
 #pr .g{margin-left:auto;color:#333;white-space:nowrap}
 #pr i{font-size:8pt;color:#333}
}
</style></head><body>
<div id="app">
<header><div class="top"><h1>Packliste <small id="ver"></small></h1><div class="nv"><nav><button data-p="gear">Ausrüstung</button><button data-p="tour">Touren</button></nav><button id="sync" class="syn off" type="button">☁ Sync einrichten</button><button id="undo" title="Letzte Änderung rückgängig machen" disabled>Zurück</button></div></div>
<div class="tr" id="trbar"><select id="tour" aria-label="Tour"></select>
<button id="new">Neue Tour</button><button id="dup">Kopieren</button><button id="ren">Umbenennen</button><button id="del">Löschen</button></div></header>
<div class="sub" id="sub"><button data-v="plan">Planung</button><button data-v="pack">Packliste</button><button data-v="food">Essensplanung</button><button data-v="exp">Ausgaben</button></div>
<div class="bar" id="bar"><input id="q" type="search" placeholder="Suchen" aria-label="Suchen">
<select id="so" aria-label="Sortierung"><option value="cat">Nach Kategorie</option><option value="name">Nach Name</option><option value="gd">Schwerste zuerst</option><option value="ga">Leichteste zuerst</option></select>
<label><input type="checkbox" id="on">Nur ausgewählte</label>
<span id="lgd" class="lg"><i class="lb"></i>am Körper<i class="lp"></i>Rucksack</span><button id="add">Gegenstand hinzufügen</button><button id="addc">Kategorie hinzufügen</button><button id="prt">Checkliste drucken</button><button id="wex">Gewichte exportieren</button></div>
<main id="list"></main>
<details class="data"><summary>Datensicherung</summary>
<button id="sopen">Synchronisation</button><button id="exp">Sicherung speichern</button><input id="imp" type="file" accept=".json" aria-label="Sicherung laden"></details>
<footer id="tot"></footer>
</div>
<div id="pr"></div>
<dialog id="md"><form method="dialog"><p id="mt"></p><input id="mi"><div id="mb"><button value="ok">OK</button><button value="cancel">Abbrechen</button></div></form></dialog>
<dialog id="sdlg"><h3>Synchronisation</h3>
<p class="hint" style="padding:0 0 8px">Deine Daten werden in deinem privaten GitHub-Repository gespeichert. Ohne Netz arbeitest du normal weiter, Änderungen werden später automatisch hochgeladen.</p>
<label>Repository (benutzername/repository)<input id="srepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="z. B. benutzername/packliste-daten"></label>
<label>Token<input id="stok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_..."></label>
<label>Datei<input id="spath" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
<p id="smsg" class="hint" style="padding:4px 0 0"></p>
<div id="sbt"><button type="button" data-s="save">Speichern und verbinden</button><button type="button" data-s="now">Jetzt synchronisieren</button><button type="button" data-s="off">Trennen</button><button type="button" class="ghost" data-s="x">Schließen</button></div></dialog>
<dialog id="wdlg"><h3>Gewichtsübersicht</h3><div id="wbody"></div><div id="wb"><button type="button" data-wb="csv">Export (CSV)</button><button type="button" data-wb="x">Schließen</button></div></dialog>
<dialog id="vdlg"><h3>Varianten vergleichen</h3><div id="vbody"></div><div id="vb"><button type="button">Schließen</button></div></dialog>
<dialog id="fdlg"><h3 id="ftit"></h3>
<label id="fart">Art<select id="fsa"><option value="f">Lebensmittel</option><option value="m">Gericht</option></select></label>
<label>Name<input id="fdn" list="fdl"></label><datalist id="fdl"></datalist>
<div id="ffood"><label>Einheit<select id="fsu"><option value="g">nach Gewicht (g)</option><option value="p">nach Stück / Packung</option></select></label>
<label id="lk">kcal pro 100 g<input id="fdk" type="number" min="0" step="any" inputmode="decimal"></label>
<label id="lw">Gewicht pro Stück in g<input id="fdw" type="number" min="0" step="any" inputmode="decimal"></label></div>
<label id="lq">Menge in g<input id="fdg" type="number" min="0" step="any" inputmode="decimal"></label>
<div id="fdb"></div></dialog>
<dialog id="cdlg"><h3 id="ctit"></h3><div id="clst"></div>
<div id="cbt"><button type="button" data-c="all">Alle auswählen</button><button type="button" data-c="ok">Kopieren (ersetzt Einträge)</button><button type="button" class="ghost" data-c="x">Abbrechen</button></div></dialog>
<dialog id="xd"><h3 id="xt"></h3>
<label>Datum<input id="xdt" type="date"></label>
<label>Kategorie<select id="xc"></select></label>
<label>Betrag<input id="xa" type="number" step="0.01" min="0" inputmode="decimal"></label>
<label>Beschreibung (optional)<input id="xn"></label>
<div id="xb"></div></dialog>
<dialog id="dlg"><h3 id="dt"></h3>
<label>Bezeichnung<input id="fn"></label>
<label>Kategorie<input id="fc" list="cl"></label>
<label>Unterkategorie<input id="fs" list="sl"></label>
<label>Gewicht (leer) in g<input id="fg" type="number" min="0" inputmode="numeric"></label>
<label>Zusatzgewicht bei voll in g (optional)<input id="ff" type="number" min="0" inputmode="numeric"></label>
<label>Inhalt<select id="ft"><option value="v">Verbrauchsmaterial</option><option value="w">Wasser</option></select></label>
<label>Anzahl vorhanden<input id="fq" type="number" min="1" inputmode="numeric"></label>
<label>Kaufpreis je Stück in € (optional)<input id="fpz" type="number" min="0" step="0.01" inputmode="decimal"></label>
<datalist id="cl"></datalist><datalist id="sl"></datalist>
<div id="acts"></div></dialog>
<script>
const D={items:[],sel:[],patch:[],seed:[]};
const K='packliste.v1';const VER='v0.17';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.items)S={items:D.items,cur:'t1',tours:[{id:'t1',name:'Neue Tour',sel:Object.fromEntries(D.sel.map(i=>[i,1])),ov:{},pl:{},ex:[]}]};
function migrate(){
 S.tours.forEach(t=>{t.pn=t.pn||{};t.pn.an=t.pn.an||{d:'',rows:[]};t.pn.ab=t.pn.ab||{d:'',rows:[]};t.pn.links=t.pn.links||[];t.pn.todo=t.pn.todo||[];t.pn.notes=t.pn.notes||'';t.of=t.of||{};t.em=t.em||{};t.qt=t.qt||{};t.ax=t.ax||[];t.cur=t.cur||'€';t.fp=t.fp||{days:[]};t.ov=t.ov||{};t.pl=t.pl||{};t.ex=t.ex||[]});
 for(const p of D.patch){const it=S.items.find(i=>i.id==p.id);if(it&&it.f===undefined){if(it.g==p.og)it.g=p.g;it.f=p.f;it.t=p.t}}
 S.seeded=S.seeded||[];S.cats=S.cats||[];S.foods=S.foods||[];S.meals=S.meals||[];S.prof=S.prof||{h:190,w:81,age:'',sex:'m',pal:1.3};S.prof.sh=S.prof.sh||{b:25,l:15,d:35,s:25};
 {const gid=()=>'x'+Math.random().toString(36).slice(2,9);
  S.foods.forEach(f=>{f.id=f.id||gid();f.u=f.u||'g';f.w=f.w||0});
  S.tours.forEach(t=>t.fp.days.forEach(d=>{d.x=d.x||{};d.sp=d.sp||{};for(const s of 'blds'){d.sp[s]=d.sp[s]||d.pk||'start';d.m[s]=d.m[s]||[];d.m[s].forEach(e=>{if(e.n!==undefined&&e.f===undefined){let f=S.foods.find(x=>x.n.toLowerCase()==e.n.trim().toLowerCase());if(!f){f={id:gid(),n:e.n.trim(),u:'g',k:+e.k||0,w:0};S.foods.push(f)}e.f=f.id;e.q=+e.g||0;delete e.n;delete e.g;delete e.k}})}}))}
 for(const sd of D.seed){if(S.seeded.includes(sd.id))continue;S.seeded.push(sd.id);
  const t={id:sd.id,name:sd.name,sel:{},ov:{},pl:{...sd.pl},ex:sd.ex.map(e=>({...e})),of:{},em:{},qt:{},ax:[],cur:'€',fp:{days:[]},food:sd.food||0};
  for(const e of t.ex)t.sel[e.id]=1;
  for(const id of sd.sel){if(S.items.some(i=>i.id==id))t.sel[id]=1;else{const o=D.items.find(x=>x.id==id);if(o){const e={...o,id:'m'+id};t.ex.push(e);t.sel[e.id]=1;if(t.pl[id])t.pl[e.id]=t.pl[id]}}}
  S.tours.push(t)}
}
migrate();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let UND=[];const snap=()=>JSON.stringify(S,(k,v)=>k=='page'||k=='view'?undefined:v);let last=snap();
const ubt=()=>{const b=$('#undo');if(b){b.disabled=!UND.length;b.textContent='Zurück'+(UND.length?' ('+UND.length+')':'')}};
const save=()=>{const c=snap();if(c!==last){UND.push(last);if(UND.length>40)UND.shift()}last=c;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}ubt();if(typeof syncSoon=='function')syncSoon()};
function undo(){if(!UND.length)return;const pg=S.page,vw=S.view;S=JSON.parse(UND.pop());S.page=pg;S.view=vw;last=snap();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}ubt();render();if(typeof syncSoon=='function')syncSoon()}
const T=()=>S.tours.find(t=>t.id==S.cur)||S.tours[0];
const G0={sel:{},ov:{},pl:{},ex:[],of:{},em:{},qt:{}};
const N=(t,i)=>Math.max(1,Math.min(+(t.qt[i.id]||1),i.q||1));
const F=(t,i)=>(t.of[i.id]??i.f)||0;const X=(t,i)=>W(t,i)+(t.em[i.id]?0:F(t,i));
const bkh=(t,a)=>{let b=0,p=0,v=0,w=0;for(const i of a){const k=N(t,i),e=W(t,i)*k,f=(t.em[i.id]?0:F(t,i))*k;if(P(t,i)=='b')b+=e+f;else{p+=e;i.t=='w'?w+=f:v+=f}}
 return`<span class="bk">${[['Körper',b,'b'],['Rucksack',p,'p'],['Verbrauch',v,'x'],['Wasser',w,'x']].filter(x=>x[1]>0).map(([n,g,c])=>`<span class="${c}">${n} ${fmt(g)}</span>`).join('')}<b>gesamt ${fmt(b+p+v+w)}</b></span>`};

  if(open){let ls='',s=null;

function dlg(id,pre){

 $('#cl').innerHTML=u('c');$('#sl').innerHTML=u('s');

 else if(a=='saveG'){Object.assign(S.items.find(i=>i.id==id),v);delete t.ov[id];delete t.of[id]}
 else if(a=='rst'){delete t.ov[id];delete t.of[id]}
 else if(a=='delG'){if(!(await ask('Aus der Gesamtliste löschen? In Touren, in denen der Gegenstand gewählt ist, bleibt er erhalten.')))return;const it0=S.items.find(i=>i.id==id);S.items=S.items.filter(i=>i.id!=id);S.tours.forEach(x=>{if(x.sel[id])x.ex.push({...it0,g:x.ov[id]??it0.g,f:(x.of[id]??it0.f)||0});delete x.ov[id];delete x.of[id]})}

async function ren(k,c,s){const o=k=='c'?c:s,n=await ask(k=='c'?'Neuer Name der Kategorie?':'Neuer Name der Unterkategorie?',o);if(!n||n==o)return;
 const f=i=>{if(k=='c'){if(i.c==c)i.c=n}else if(i.c==c&&i.s==s)i.s=n};
 S.items.forEach(f);S.tours.forEach(t=>t.ex.forEach(f));S.cats.forEach(f);save();render()}
const CATS=['Essen','Übernachten','Mobilität','Sonstiges'];
const nf=v=>v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>new Date(d+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});

 for(const e of ax){const d=days[e.d]=days[e.d]||{};d[e.c]=(d[e.c]||0)+e.a;tot[e.c]+=e.a;sum+=e.a}
 return{ax,days,tot,sum}}
function expHtml(t){const{ax,days,tot,sum}=agg(t),dk=Object.keys(days),m=v=>nf(v)+' '+esc(t.cur),ds=d=>CATS.reduce((a,c)=>a+(days[d][c]||0),0);
 let h=`<div class="xtb"><button data-a="ae">Ausgabe hinzufügen</button><button data-a="xe">Export (CSV)</button><button data-a="cu">Währung: ${esc(t.cur)}</button></div>`;
 if(!ax.length)return h+'<p>Noch keine Ausgaben für diese Tour.</p>';
 h+=`<div class="xs"><div><b>${m(sum)}</b><span>Gesamt</span></div>${CATS.map(c=>`<div><b>${m(tot[c])}</b><span>${c}</span></div>`).join('')}<div><b>${m(sum/dk.length)}</b><span>Ø pro Tag (${dk.length} Tage)</span></div></div>`;
 h+=`<section class="cat"><h2>Pro Tag<small>in ${esc(t.cur)}</small></h2><div class="xw"><table class="xt"><thead><tr><th>Tag</th>${CATS.map(c=>`<th>${c}</th>`).join('')}<th>Summe</th></tr></thead><tbody>${dk.map(d=>`<tr><td>${fd(d)}</td>${CATS.map(c=>`<td>${days[d][c]?nf(days[d][c]):'–'}</td>`).join('')}<td><b>${nf(ds(d))}</b></td></tr>`).join('')}</tbody><tfoot><tr><td>Gesamt</td>${CATS.map(c=>`<td>${nf(tot[c])}</td>`).join('')}<td>${nf(sum)}</td></tr></tfoot></table></div></section>`;

 return h}

// Dreiwege-Zusammenführung: b = letzter gemeinsamer Stand, l = dieses Gerät, r = online
function m3(b,l,r){
 if(J(l)===J(r))return l;if(J(b)===J(l))return r;if(J(b)===J(r))return l;
 const isO=x=>x&&typeof x=='object'&&!Array.isArray(x);
 if(Array.isArray(l)&&Array.isArray(r)){
  const ids=a=>a.every(x=>isO(x)&&'id' in x),ba=Array.isArray(b)?b:[];
  if(ids(l)&&ids(r)&&ids(ba)){
   const B=new Map(ba.map(x=>[x.id,x])),L=new Map(l.map(x=>[x.id,x])),R=new Map(r.map(x=>[x.id,x])),out=[];
   for(const id of [...r.map(x=>x.id),...l.map(x=>x.id).filter(i=>!R.has(i))]){const bx=B.get(id),lx=L.get(id),rx=R.get(id);
    if(lx&&rx)out.push(m3(bx,lx,rx));
    else if(lx){if(!bx||J(bx)!==J(lx))out.push(lx)}
    else if(rx){if(!bx||J(bx)!==J(rx))out.push(rx)}}
   return out}
  const bs=new Set(ba.map(J)),ls=new Set(l.map(J)),rs=new Set(r.map(J)),seen=new Set(),out=[];
  for(const x of [...r,...l]){const k=J(x);if(seen.has(k))continue;seen.add(k);if(bs.has(k)&&!(ls.has(k)&&rs.has(k)))continue;out.push(x)}
  return out}

  for(const k of new Set([...Object.keys(r),...Object.keys(l)])){const iL=k in l,iR=k in r,iB=k in bo;
   if(iL&&iR)out[k]=m3(bo[k],l[k],r[k]);
   else if(iL){if(!iB||J(bo[k])!==J(l[k]))out[k]=l[k]}
   else{if(!iB||J(bo[k])!==J(r[k]))out[k]=r[k]}}
  return out}

async function sync(){

   else if(!base&&!S.items.length&&S.tours.every(t=>!Object.keys(t.sel).length))merged=rd;
   else merged=m3(base?base.data:{},local,rd);
   if(J(merged)!==J(local)){const pg=S.page,vw=S.view;S=Object.assign(JSON.parse(J(merged)),{page:pg,view:vw});migrate();if(!S.tours.some(t=>t.id==S.cur))S.cur=S.tours[0]&&S.tours[0].id;
